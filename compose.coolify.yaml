# Coolify: choose Docker Compose build pack and this file as Compose Location.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      APP_URL: ${APP_URL:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      COOKIE_SECURE: "true"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:-spa_management}
      DATABASE_USER: ${POSTGRES_USER:-spa}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:-Owner}
      BOOKING_RATE_LIMIT_IP_MAX: ${BOOKING_RATE_LIMIT_IP_MAX:-5}
      BOOKING_RATE_LIMIT_IP_WINDOW_SECONDS: ${BOOKING_RATE_LIMIT_IP_WINDOW_SECONDS:-900}
      BOOKING_RATE_LIMIT_PHONE_MAX: ${BOOKING_RATE_LIMIT_PHONE_MAX:-3}
      BOOKING_RATE_LIMIT_PHONE_WINDOW_SECONDS: ${BOOKING_RATE_LIMIT_PHONE_WINDOW_SECONDS:-3600}
      BOOKING_RATE_LIMIT_GLOBAL_MAX: ${BOOKING_RATE_LIMIT_GLOBAL_MAX:-120}
      BOOKING_RATE_LIMIT_GLOBAL_WINDOW_SECONDS: ${BOOKING_RATE_LIMIT_GLOBAL_WINDOW_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    stop_grace_period: 30s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spa_management}
      POSTGRES_USER: ${POSTGRES_USER:-spa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - spa_postgres_production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  spa_postgres_production:
