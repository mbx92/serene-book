services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: spa_local_password
      POSTGRES_DB: spa_management
    ports:
      - "5432:5432"
    volumes:
      - spa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spa -d spa_management"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  spa_postgres:
