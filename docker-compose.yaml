# Coolify: app only; DATABASE_URL connects to your existing PostgreSQL.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "3088"
    networks:
      - coolify
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3088"
      APP_URL: ${APP_URL:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      COOKIE_SECURE: "true"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your existing PostgreSQL connection URL}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:-Owner}
      BOOKING_RATE_LIMIT_IP_MAX: ${BOOKING_RATE_LIMIT_IP_MAX:-5}
      BOOKING_RATE_LIMIT_IP_WINDOW_SECONDS: ${BOOKING_RATE_LIMIT_IP_WINDOW_SECONDS:-900}
      BOOKING_RATE_LIMIT_PHONE_MAX: ${BOOKING_RATE_LIMIT_PHONE_MAX:-3}
      BOOKING_RATE_LIMIT_PHONE_WINDOW_SECONDS: ${BOOKING_RATE_LIMIT_PHONE_WINDOW_SECONDS:-3600}
      BOOKING_RATE_LIMIT_GLOBAL_MAX: ${BOOKING_RATE_LIMIT_GLOBAL_MAX:-120}
      BOOKING_RATE_LIMIT_GLOBAL_WINDOW_SECONDS: ${BOOKING_RATE_LIMIT_GLOBAL_WINDOW_SECONDS:-60}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3088/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 5
    stop_grace_period: 30s
networks:
  coolify:
    external: true
